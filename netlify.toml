# NOTARIX — Netlify deployment configuration
# Angular SPA: purely static client-side application.
# Disable Netlify's automatic Angular SSR runtime plugin so it builds as a static SPA.

[build]
  command = "npm run build"
  publish = "dist/notarix-palasan/browser"

[build.environment]
  NODE_VERSION = "24.15.0"
  NETLIFY_SKIP_PLUGINS = "@netlify/angular-runtime"

# SPA fallback: direct navigation and page refresh work on every route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
